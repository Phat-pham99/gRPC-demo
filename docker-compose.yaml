services:
  fastapi_service:
    build:
      context: .
      dockerfile: FastAPI-service/Dockerfile
    container_name: fastapi_service
    # Keep external ports if you need access from your host machine (browser/Postman)
    ports:
      - "8000:8000"   # REST Engine Port
      - "50051:50051" # gRPC Engine Port
    networks:
      - iot_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nestjs_service:
    build:
      context: .
      dockerfile: nestjs-service/Dockerfile
    container_name: nestjs_service
    ports:
      - "3000:3000"   # WebSocket Entrypoint
    environment:
      - PYTHONUNBUFFERED=1
      - MODE=grpc # Switch to 'rest' or 'grpc' to execute your benchmark phases
      - REST_API_URL=http://fastapi_service:8000
      - GRPC_API_URL=fastapi_service:50051
    depends_on:
      fastapi_service:
        condition: service_healthy
    networks:
      - iot_network
    restart: unless-stopped

networks:
  iot_network:
    driver: bridge
